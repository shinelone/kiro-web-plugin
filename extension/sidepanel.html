<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiro 流式问答</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- 顶栏 -->
    <header class="topbar">
      <!-- 左：页面上下文（开关、页面标题、预览、重新抓取） -->
      <div class="page-ctx" id="pagebar">
        <label class="ctx-toggle" title="页面上下文：开启后，提问会带上当前页面内容">
          <input type="checkbox" id="useContext" checked aria-label="页面上下文" />
          <span class="switch" aria-hidden="true"></span>
          <span class="ctx-label">页面上下文</span>
        </label>
        <span class="full-src hidden" id="fullSrc" title="全屏页始终针对打开它的那个标签页">绑定页面</span>
        <span class="page-title" id="pageTitle" title="">未获取页面</span>
        <button
          class="icon-btn icon-btn--sm"
          id="previewBtn"
          type="button"
          title="预览发给 Kiro 的页面内容"
          aria-label="预览页面内容"
        >
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </button>
        <button
          class="icon-btn icon-btn--sm"
          id="refreshPageBtn"
          type="button"
          title="重新抓取当前页面"
          aria-label="重新抓取当前页面"
        >
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M20 12a8 8 0 10-2.3 5.6M20 7v5h-5"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <span class="bar-divider" aria-hidden="true"></span>

      <!-- 右：后端状态与全局操作 -->
      <div class="bar-actions">
        <button class="status-chip" id="status" type="button" title="后端状态（点击重新检测）">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text" id="statusText">检测中</span>
        </button>
        <button class="icon-btn" id="mapBtn" type="button" title="追问关系图" aria-label="追问关系图" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="6" cy="5.5" r="2" stroke="currentColor" stroke-width="1.6" />
            <circle cx="18" cy="12" r="2" stroke="currentColor" stroke-width="1.6" />
            <circle cx="18" cy="19" r="2" stroke="currentColor" stroke-width="1.6" />
            <path d="M6 7.5V15a4 4 0 004 4h6M6 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
        <button class="icon-btn" id="expandBtn" type="button" title="在新标签页中全屏打开" aria-label="全屏打开">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="icon-btn hidden" id="fullscreenBtn" type="button" title="浏览器全屏（F11 效果，Esc 退出）" aria-label="浏览器全屏">
          <svg class="fs-enter" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg class="fs-exit" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
          <!-- 滑块（调节）图标 -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M4 7h9M17 7h3M4 17h3M11 17h9"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <circle cx="15" cy="7" r="2" stroke="currentColor" stroke-width="1.6" />
            <circle cx="9" cy="17" r="2" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>

        <button class="icon-btn" id="clearBtn" type="button" title="开启新会话（清空对话与记忆）" aria-label="开启新会话">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0111 4h2a1.5 1.5 0 011.5 1.5V7M6 7l.8 11.2A2 2 0 008.8 20h6.4a2 2 0 002-1.8L18 7M10 11v5M14 11v5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- 后端离线横幅 -->
    <div class="backend-bar hidden" id="backendBar" role="status">
      <span class="backend-msg" id="backendMsg">后端未运行</span>
      <button type="button" class="backend-btn" id="startBackendBtn">启动后端</button>
    </div>

    <!-- 页面内容预览浮层 -->
    <div class="modal-overlay hidden" id="previewModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <div class="modal-head">
          <span class="modal-title" id="previewTitle">发给 Kiro 的页面内容</span>
          <button class="icon-btn icon-btn--sm" id="previewClose" type="button" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="modal-meta" id="previewMeta"></div>
        <div class="modal-body" id="previewBody"></div>
      </div>
    </div>

    
    <!-- 对话区 -->
    <div class="chat-body" id="chatBody">
      <main class="messages" id="messages"></main>

      <!-- 选中回答里的文字后浮出的「追问」按钮 -->
      <button type="button" class="sel-ask hidden" id="selAsk">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5h14v10H9l-4 4V5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
        <span>追问</span>
      </button>

      <!-- 追问关系图：侧边栏里是右侧抽屉，全屏页里是右栏 -->
      <aside class="thread-map" id="threadMap" aria-label="追问关系图">
        <div class="tm-head">
          <span class="tm-title">追问关系</span>
          <button class="icon-btn icon-btn--sm" id="mapClose" type="button" title="收起" aria-label="收起追问关系图">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="tm-tree" id="tmTree" role="tree"></div>
      </aside>
    </div>

    <!-- 输入区 -->
    <form class="composer" id="composer">
      <!-- 快捷问题 -->
      <div class="quick-actions" id="quickActions">
        <button type="button" data-q="请用中文简明总结这个页面的主要内容，分点列出。">总结页面</button>
        <button type="button" data-q="请把这个页面的核心要点提炼成不超过 5 条的清单。">提取要点</button>
        <button type="button" data-q="请把这个页面的主要内容翻译成中文。">翻译</button>
        <button type="button" data-q="这个页面里有哪些关键数据、数字或结论？请列出来。">关键数据</button>
      </div>
      <!-- 追问引用条：显示这次提问引用的是哪段内容 -->
      <div class="quote-bar hidden" id="quoteBar">
        <span class="quote-bar-label" id="quoteLabel">追问</span>
        <span class="quote-bar-text" id="quoteText"></span>
        <button type="button" class="quote-bar-clear" id="quoteClear" title="取消引用" aria-label="取消引用">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="composer-field">
        <textarea
          id="input"
          rows="1"
          placeholder="向 Kiro 提问…  Enter 发送 · Shift+Enter 换行"
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" title="发送" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5 12l14-7-4.5 14.5-3-6-6.5-1.5z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </button>
        <button type="button" id="stopBtn" class="stop-btn hidden" title="停止" aria-label="停止生成">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" />
          </svg>
        </button>
      </div>
      <div class="composer-tools">
        <label class="model-pick" id="agentPick" title="切换 Agent（切换后开启新会话）">
          <svg class="model-pick-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <select id="agentSelect" aria-label="Agent">
            <option value="">默认 Agent</option>
          </select>
        </label>
        <label class="model-pick" id="modelPick" title="切换模型（对应 kiro-cli --model）">
          <svg class="model-pick-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M4 7.5l8 4.5 8-4.5M12 12v9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <select id="modelSelect" aria-label="模型">
            <option value="">跟随 Agent</option>
          </select>
        </label>
        <span class="tool-chips" id="toolChips" title="当前 Agent 可用的工具"></span>
      </div>
    </form>

    <script src="native.js"></script>
    <script src="extract.js"></script>
    <script src="markdown.js"></script>
    <script type="module" src="pdf-extract.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
